# Example Taskfile following rules.md. Copy it, keep the LOG var and the
# header, replace the tasks.
#
# Usage:
#   task                         # list tasks
#
#   Build
#   task build [-- <target>]     # build, then verify (TARGET=default)
#   task verify                  # verify the last build only
#
#   Maintenance
#   task clean                   # remove build output (asks first)

version: '3'
silent: true

vars:
  OUT: '{{.TASKFILE_DIR}}/out'
  # Output convention: stage/info/note/ok/fail, color only on a TTY.
  # Prefix a cmd with {{.LOG}} to get the functions; each cmd is a separate shell.
  LOG: >-
    if [ -t 1 ] && [ -z "${NO_COLOR:-}" ]; then
    _b=$(printf '\033[1;34m'); _w=$(printf '\033[1;37m'); _g=$(printf '\033[1;32m'); _r=$(printf '\033[1;31m'); _0=$(printf '\033[0m');
    else _b= _w= _g= _r= _0=; fi;
    stage() { printf '\n%s▶ %s%s\n' "$_b" "$*" "$_0"; };
    info() { printf '  %s\n' "$*"; };
    note() { printf '  %s%s%s\n' "$_w" "$*" "$_0"; };
    ok() { printf '\n%s✓ %s%s\n' "$_g" "$*" "$_0"; };
    fail() { printf '\n%s✗ %s%s\n' "$_r" "$*" "$_0" >&2; };

tasks:
  default:
    desc: List available tasks
    cmds:
      - '{{.LOG}} stage "Available tasks"'
      - task --list

  # ===========================================================================
  # Build
  #
  # Logic lives in scripts/build.sh; the task only picks the target and
  # prints the summary. Stages [1/3]..[3/3] are printed by the script.
  # ===========================================================================
  build:
    desc: Build the target, then verify it — task build [-- <target>] (TARGET=default)
    vars:
      TARGET: '{{.CLI_ARGS | default "default"}}'
    cmds:
      - defer: '{{.LOG}} if [ -n "{{.EXIT_CODE}}" ]; then fail "Failed: {{.TASK}} (exit {{.EXIT_CODE}})"; else ok "Done: {{.TASK}}"; fi'
      - OUT="{{.OUT}}" {{.TASKFILE_DIR}}/scripts/build.sh "{{.TARGET}}"
      - task: verify

  # One-stage task: one stage, no defer. Called from build, so no summary here.
  verify:
    desc: Verify the last build output
    preconditions:
      - sh: test -f "{{.OUT}}/result"
        msg: "No build output in {{.OUT}}; run 'task build' first"
    cmds:
      - '{{.LOG}} stage "Verify"; info "output: {{.OUT}}/result"'
      - test -s "{{.OUT}}/result"

  # ===========================================================================
  # Maintenance
  # ===========================================================================
  clean:
    desc: Remove build output (asks first)
    prompt: 'Delete {{.OUT}}?'
    preconditions:
      - sh: test -d "{{.OUT}}"
        msg: "Nothing to clean: {{.OUT}} does not exist"
    cmds:
      - '{{.LOG}} stage "Clean"; info "removing {{.OUT}}"'
      - rm -rf "{{.OUT}}"
